# Shared tmux settings; the native package manager owns tmux. Dotfiles link
# ~/.config/tmux/tmux.conf to a forwarder that sources this file from the
# installed Nix profile.
set -g default-terminal "tmux-256color"
set -g base-index 0
setw -g pane-base-index 0
set -g status-keys vi
setw -g mode-keys vi
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g mouse on
set -g focus-events off
setw -g aggressive-resize off
setw -g clock-mode-style 12
set -s escape-time 10
set -g history-limit 50000
set -as terminal-overrides ',xterm*:RGB'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
unbind [
bind Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Native copy replaces tmux-yank; terminal OSC 52 support controls the clipboard.
set -s set-clipboard external
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Keep the green power-theme intent without a third-party plugin or store path.
set -g status-style 'bg=#303030,fg=#99C794'
set -g status-left '#[bold] #S #[default]'
set -g status-right ' %H:%M %d-%b '
setw -g window-status-current-style 'bg=#99C794,fg=#303030,bold'
set -g pane-active-border-style 'fg=#99C794'

# Optional host-only settings remain outside the shared configuration.
source-file -q ~/.config/tmux/local.conf
